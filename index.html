<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TChaJue</title>
<meta name="description" content="TChaJue 的个人主页">
<style>
  :root {
    --bg: #0b0e14;
    --surface: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #7c3aed;
    --accent2: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -30%; left: 50%;
    transform: translateX(-50%);
    width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.16), transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 80px 24px 60px;
  }

  /* Hero */
  .hero { text-align: center; margin-bottom: 56px; }

  .avatar {
    width: 116px; height: 116px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
    padding: 3px;
    margin-bottom: 22px;
    display: inline-block;
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; display: block; }

  h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tagline {
    font-size: 1.05rem;
    color: var(--muted);
    margin-top: 10px;
    max-width: 480px;
    margin-inline: auto;
  }

  .meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 18px;
    font-size: 0.87rem;
    color: var(--muted);
  }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .meta svg { width: 14px; height: 14px; fill: currentColor; opacity: 0.8; }

  /* Section */
  section { margin-bottom: 44px; }

  h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Skills */
  .skills { display: flex; flex-wrap: wrap; gap: 9px; }
  .skills span {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    transition: all 0.2s ease;
  }
  .skills span:hover {
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
  }

  /* Projects */
  .projects { display: grid; gap: 14px; }

  .card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    transition: all 0.22s ease;
  }
  .card:hover {
    border-color: rgba(124, 58, 237, 0.6);
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.06);
  }
  .card h3 {
    font-size: 1.02rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h3::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    flex-shrink: 0;
  }
  .card p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 7px;
  }

  /* Links */
  .links { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }
  .btn:hover {
    border-color: var(--accent);
    background: rgba(124, 58, 237, 0.14);
    transform: translateY(-2px);
  }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .wrap { padding: 52px 18px 40px; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
